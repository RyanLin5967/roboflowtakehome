[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "counterpart"
version = "0.1.0"
description = "Reliable collection of controlled visual pairs with Roboflow"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "psycopg[binary,pool]==3.3.6",
  "pydantic==2.13.5", "pydantic-settings==2.15.0", "httpx==0.28.1",
  "python-multipart>=0.0.20,<0.1", "pillow>=12,<13",
  "boto3==1.43.103",
]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.168.1", "ruff>=0.15,<0.16", "moto[server,s3]==5.2.3"]

[project.scripts]
counterpart = "counterpart.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires isolated PostgreSQL test database", "provider: explicit cloud integration"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
