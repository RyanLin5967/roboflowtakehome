name: Verify Counterpart
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: counterpart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COUNTERPART_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/counterpart_test
      COUNTERPART_LIVE_ENABLED: "false"
      COUNTERPART_EXPORT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Upgrade tests execute the actual earlier application/schema, rather
          # than a hand-written approximation of historical persisted data.
          fetch-depth: 0
      - name: PostgreSQL 17 client for the actual backup and restore drill
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build --wheel
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Browser against real API and worker
        run: |
          export COUNTERPART_DATABASE_URL="$COUNTERPART_TEST_DSN"
          uv run counterpart serve > /tmp/counterpart-api.log 2>&1 &
          counterpart_api_pid=$!
          uv run counterpart worker > /tmp/counterpart-worker.log 2>&1 &
          counterpart_worker_pid=$!
          trap 'kill "$counterpart_api_pid" "$counterpart_worker_pid" 2>/dev/null || true' EXIT
          node scripts/browser_smoke.mjs
          node scripts/browser_product_smoke.mjs
          node scripts/gap_browser.mjs
          uv run python scripts/inspect_release.py artifacts/gap-browser/dataset.zip --allow-replay --show 0
      - name: Multi-collector process-failure probe
        run: uv run python scripts/product_fault_probe.py
